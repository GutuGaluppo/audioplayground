name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp:
    name: C++ build + tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The desktop app embeds the web UI, so the C++ build needs Node + pnpm.
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cmake --preset dev
      # Step-level timeouts keep the log if something hangs (a job-level timeout discards it).
      # One job per core: an unbounded `make -j` on the small macOS runner compiles every JUCE
      # module at once and swaps (the build hit 50 minutes).
      - name: Build
        shell: bash
        run: |
          cores=$( (getconf _NPROCESSORS_ONLN || sysctl -n hw.ncpu || echo 4) 2>/dev/null | head -1)
          cmake --build --preset dev --parallel "${NUMBER_OF_PROCESSORS:-$cores}"
        timeout-minutes: 75
      - run: ctest --preset dev --timeout 300
        timeout-minutes: 10

  sanitizers:
    name: C++ tests (ASan + UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cmake --preset asan
      - run: cmake --build --preset asan --parallel
      - run: ctest --preset asan

  thread-sanitizer:
    name: C++ tests (ThreadSanitizer)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cmake --preset tsan
      - run: cmake --build --preset tsan --parallel
      - run: ctest --preset tsan

  realtime-sanitizer:
    name: C++ tests (RealtimeSanitizer)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: clang-20
      CXX: clang++-20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Clang 20 from the signed LLVM apt repository
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-20 main" | sudo tee /etc/apt/sources.list.d/llvm-20.list
          sudo apt-get update -q
          sudo apt-get install -y -q clang-20
      - run: cmake --preset rtsan
      - run: cmake --build --preset rtsan --parallel
      - run: ctest --preset rtsan

  fuzz:
    name: Fuzz project loader (60 s)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cmake --preset fuzz
      - run: cmake --build --preset fuzz --parallel
      - name: Fuzz
        run: |
          mkdir -p fuzz-corpus
          cp tests/fuzz/corpus/project/* fuzz-corpus/
          ./build/fuzz/tests/ap_fuzz_project_loader fuzz-corpus -max_total_time=60 -max_len=65536 -timeout=10 -rss_limit_mb=2048

  cpp-format:
    name: clang-format
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx run clang-format==23.1.2 --dry-run --Werror $(git ls-files '*.cpp' '*.h' ':!:**/generated/**')

  ui:
    name: UI typecheck, lint, format, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm ui:build

  web:
    name: Browser build (WebAssembly)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Emscripten from the official emsdk, pinned to a release tag and cached.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: emsdk
        with:
          path: ~/emsdk
          key: emsdk-6.0.10-${{ runner.os }}
      - name: Install Emscripten
        if: steps.emsdk.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 6.0.10 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install 6.0.10
      - name: Build the engine
        run: |
          ~/emsdk/emsdk activate 6.0.10
          source ~/emsdk/emsdk_env.sh
          tools/web/build.sh
        timeout-minutes: 20
      - run: pnpm web:test
      - run: pnpm --filter @ap/ui build:web

